<!-- Question: Create an employee payroll webpage using HTML, 
 external CSS and JavaScript.

The webpage should:
1. Store at least 5 employees in an array of objects. 
Each employee must have an ID, name, department and basic salary.
2. Display a Show Employees button that displays all
 employee records in an HTML table.
3. Include a department dropdown to filter the displayed employees.
4. Include a Calculate Average Salary button that displays 
the average salary of all employees.
5. Display the name and salary of the highest-paid employee.
6. Perform all operations on the same page without reloading it. -->


<html>

<head>
    <title>Employee Payroll</title>
</head>

<body>
    <h2>Employee Payroll System</h2>

    <button type="button" onclick="showEmployees()">
        Show Employees
    </button>

    <br><br>

    Select Department:
    <select id="dep" onchange="showEmployees()">
        <option value="All">All Departments</option>
        <option value="IT">IT</option>
        <option value="HR">HR</option>
        <option value="Finance">Finance</option>
    </select>

    <br><br>

    <button type="button" onclick="averageSalary()">
        Calculate Average Salary
    </button>

    <button type="button" onclick="highestSalary()">
        Highest Paid Employee
    </button>

    <p id="average"></p>
    <p id="highest"></p>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Basic Salary</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script>
        let employees = [
            { id: 1, name: "Amit", department: "IT", salary: 50000 },
            { id: 2, name: "Priya", department: "HR", salary: 40000 },
            { id: 3, name: "Rahul", department: "Finance", salary: 60000 },
            { id: 4, name: "Sneha", department: "IT", salary: 70000 },
            { id: 5, name: "Karan", department: "HR", salary: 35000 }
        ];

        function showEmployees() {
            let dep = document.getElementById("dep").value;
            let data = "";

            for (let i = 0; i < employees.length; i++) {
                if (dep == "All" ||
                    employees[i].department == dep) {

                    data += "<tr>";
                    data += "<td>" + employees[i].id + "</td>";
                    data += "<td>" + employees[i].name + "</td>";
                    data += "<td>" + employees[i].department + "</td>";
                    data += "<td>" + employees[i].salary + "</td>";
                    data += "</tr>";
                }
            }

            document.getElementById("tableBody").innerHTML = data;
        }

        function averageSalary() {
            let total = 0;

            for (let i = 0; i < employees.length; i++) {
                total += employees[i].salary;
            }

            let avg = total / employees.length;

            document.getElementById("average").innerHTML =
                "Average Salary: Rs. " + avg;
        }

        function highestSalary() {
            let highest = employees[0];

            for (let i = 1; i < employees.length; i++) {
                if (employees[i].salary > highest.salary) {
                    highest = employees[i];
                }
            }

            document.getElementById("highest").innerHTML =
                "Highest Paid Employee: " + highest.name +
                ", Salary: Rs. " + highest.salary;
        }
    </script>

</body>

</html>
